[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-recommendation-engine"
version = "0.1.0"
description = "Semantic search and RAG over Paris hotel reviews"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "datasets>=2.19,<4",
    "sentence-transformers>=2.7,<4",
    "qdrant-client>=1.12,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.5,<1",
]

[project.scripts]
hotel-search-engine-ingest = "hotel_recommendation_engine.ingest:main"
hotel-search-engine-search = "hotel_recommendation_engine.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
